# ~/.config/tmux/tmux.conf   (ln -s ~/dotfiles/tmux ~/.config/tmux)
#
# Mental model
#   server  - one background process, survives closing Ghostty
#   session - one project              (prefix f / prefix s to switch)
#   window  - a "tab" inside a project (Alt-1..9 to jump, prefix c to create)
#   pane    - a split inside a window  (Ctrl-h/j/k/l, shared with nvim splits)
#
# Keys avoid [ ] { } ~ ^ ` \ on purpose: they need AltGr / dead keys on the PT layout.

# --- Prefix -------------------------------------------------------------------
# Ctrl-Space: unused by zsh, Claude Code and nvim (cmp also opens on <C-n>)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Terminal (Ghostty) -------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:hyperlinks:clipboard:sync:usstyle"
set -g extended-keys on            # Shift+Enter, Ctrl+. etc. reach Claude Code / nvim
set -g extended-keys-format csi-u
set -g allow-passthrough on        # image.nvim graphics + desktop notifications (OSC 9/777)
set -g set-clipboard on            # yank in copy mode -> system clipboard via OSC 52
set -g focus-events on             # lets nvim reload files agents changed (FocusGained)
set -sg escape-time 0
set -g mouse on                    # hold Shift to use Ghostty's own selection
set -g history-limit 50000
set -g set-titles on
set -g set-titles-string "#S / #W"

# --- Windows & panes ----------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off       # closing the last window of a project jumps to another

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind x kill-pane
bind X confirm-before -p "kill window #W? (y/n)" kill-window
bind Tab last-window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt-1..9: jump straight to a window, no prefix (Hyprland owns SUPER, so Alt is free)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# --- Seamless nvim <-> tmux navigation (pairs with vim-tmux-navigator in nvim) -
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind C-l send-keys C-l             # prefix Ctrl-l = clear the shell screen

# --- Copy mode (vi keys) ------------------------------------------------------
setw -g mode-keys vi
bind Enter copy-mode               # instead of prefix [ (AltGr+8 on PT)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Popups: tools you open, use and close ------------------------------------
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind t display-popup -E -w 80% -h 70% -d "#{pane_current_path}"
bind e split-window -h -c "#{pane_current_path}" nvim

# --- Projects & agents --------------------------------------------------------
# Session/window tree. Phase 2 swaps prefix f for an fzf+zoxide project picker.
bind f choose-tree -Zs
# Only the windows that have an agent in them, across all projects
bind a choose-tree -Zw -f "#{!=:#{@claude_state},}"
# Phase 2: new worktree + agent window
# bind W command-prompt -p "branch:" "run-shell 'tmux-agent %%'"

# Agent state is written per window by Claude Code hooks (phase 2):
#   tmux set -w -t "$TMUX_PANE" @claude_state working|blocked|done
set -g @agent "#{?#{==:#{@claude_state},blocked},#[fg=colour167]● ,#{?#{==:#{@claude_state},working},#[fg=colour214]● ,#{?#{==:#{@claude_state},done},#[fg=colour108]● ,}}}"
# "done" turns back to nothing once you look at that window
set-hook -g session-window-changed 'if -F "#{==:#{@claude_state},done}" "set -wu @claude_state"'

# --- Status bar ---------------------------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=colour250"
set -g status-left-length 30
set -g status-left "#[fg=colour208,bold] #S #[default]│ "
set -g status-right "#[fg=colour245]#{?client_prefix,#[fg=colour208]PREFIX ,}%H:%M "
setw -g window-status-format " #{E:@agent}#[fg=colour245]#I #W "
setw -g window-status-current-format " #{E:@agent}#[fg=colour208,bold]#I #W "
setw -g window-status-separator ""
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour208"
set -g message-style "bg=default,fg=colour208"
setw -g mode-style "bg=colour208,fg=colour235"
