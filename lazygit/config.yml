gui:
  # If true, use the theme from the terminal. 
  # If false, use the theme specified in the config.
  theme:
    activeBorderColor:
      - green
      - bold
    inactiveBorderColor:
      - white
    searchingActiveBorderColor:
      - cyan
      - bold
    optionsTextColor:
      - blue
    selectedLineBgColor:
      - blue
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitBgColor:
      - cyan
    cherryPickedCommitFgColor:
      - blue
    markedBaseCommitBgColor:
      - yellow
    markedBaseCommitFgColor:
      - blue
    unstagedChangesColor:
      - red
    defaultFgColor:
      - white
git:
  # Cycle between renderers with `|` (and `\` in reverse)
  # First one goes side-by-side only when the diff view is wide enough
  diffRenderers:
    - colorArg: always
      command: delta --{{colorScheme}} --paging=never {{if gt .width 160}}--side-by-side{{end}} -w={{width}}
    - colorArg: always
      command: delta --{{colorScheme}} --paging=never
# Custom keybindings can be added here
keybinding:
  universal:
    quit: 'q'
    quit-alt1: '<c-c>'
    return: '<esc>'
