# Monitor
monitor=,preferred,auto,1

# Layout
general {
    layout = master
}

# Programs
$terminal = ghostty 
$menu = rofi -show drun

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP  # helps apps find gnome keyring
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = waybar
exec-once = hypridle
exec-once = awww-daemon && awww img $(cat ~/.cache/current_wallpaper)

# Environment Variables
env = GTK_IM_MODULE,simple
env = PATH,$HOME/.local/bin:$HOME/go/bin:$PATH
env = MAIL_CLIENT,firefox https://mail.google.com
env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots

input {
  kb_layout = pt
  kb_options = ctrl:swapcaps
  follow_mouse = 1
  touchpad {
      natural_scroll = true
  }
}

gesture = 3, horizontal, workspace

# Don't change manually set window sizes
dwindle {
  preserve_split = true
}

# Keybinds
$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive, 
bind = $mainMod, D, exec, $menu
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, A, fullscreen, 0
bind = $mainMod SHIFT, U, exec, loginctl lock-session # Lock screen
bind = $mainMod SHIFT, E, exit, # exit wayland

# Select windows / move focus
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move windows
bind = $mainMod SHIFT, h, swapwindow, l
bind = $mainMod SHIFT, l, swapwindow, r
bind = $mainMod SHIFT, k, swapwindow, u
bind = $mainMod SHIFT, j, swapwindow, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = ALT, R, submap, resize
submap = resize

binde = , l, resizeactive, 20 0
binde = , h, resizeactive, -20 0
binde = , k, resizeactive, 0 20
binde = , j, resizeactive, 0 -20

bind = , escape, submap, reset
bind = , return, submap, reset

submap = reset

# Volume keys + Pavucontrol
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = $mainMod SHIFT, p, exec, pavucontrol

# Screenshots
bind = , Print, exec, hyprshot -m region

# Apps
bind = $mainMod SHIFT, f, exec, firefox
bind = $mainMod SHIFT, s, exec, spotify
bind = $mainMod SHIFT, m, exec, $MAIL_CLIENT

# Window rules
windowrule {
  name = pavucontrol-menu
  match:class = ^(org.pulseaudio.pavucontrol)$
  
  float = on
  size = 600 400
  center = on
  no_shadow = on
  
  # Syntax: opacity = active_val inactive_val fullscreen_val
  opacity = 0.95 override 0.85 override 1.0 override
}

