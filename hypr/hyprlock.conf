background {
  monitor = 
  path = screenshot
  color = rgba(25, 20, 20, 1.0)
  blur_passes = 2
}

input-field {
  monitor =
  size = 300, 50
  outline_thickness = 2
  dots_size = 0.25
  dots_spacing = 0.1
  dots_center = true
  inner_color = rgba(200, 200, 200, 0.2)
  outer_color = rgba(150, 150, 150, 0.4)
  font_color = rgb(303030)
  fade_on_empty = true
  placeholder_text = <i>Password</i>
  hide_input = false
  position = 0, -20
  halign = center
  valign = center
}

label {
  monitor =
  text = $TIME
  color = rgba(200, 200, 200, 1.0)
  font_size = 64
  font_family = JetBrainsMono Nerd Font
  position = 0, 80
  halign = center
  valign = center
}
